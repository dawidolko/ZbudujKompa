name: Deploy to GitHub Pages

# =============================================================================
# Builds the static export and publishes it to GitHub Pages.
#
# Quality gates run before the deploy job, and the deploy depends on them, so a
# build that fails typecheck, lint, formatting or accessibility never reaches
# production.
# =============================================================================

on:
  push:
    branches: [main]
  # Allows a manual redeploy from the Actions tab without an empty commit.
  workflow_dispatch:

# Least privilege: the workflow pushes the built site to a branch, so writing
# repository contents is all it needs.
permissions:
  # The build pushes the export to the gh-pages branch, so it needs to write
  # repository contents rather than the Pages artefact store.
  contents: write

# One deploy at a time, in a group of our own. GitHub's built-in Jekyll job
# uses the `pages` group; sharing it let Jekyll cancel this workflow mid-run.
concurrency:
  group: deploy-static-export
  cancel-in-progress: false

env:
  NODE_VERSION: '22'

jobs:
  # ---- Static analysis ------------------------------------------------------
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # The repository is public, so a leaked key would be world-readable.
      # This runs before anything else, so a bad push fails fast.
      - name: Scan for committed credentials
        run: npm run check:secrets

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

  # ---- Build and behavioural tests -----------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Keyed on the Playwright version, so a bump fetches a fresh browser and
      # anything else reuses the cached one.
      - name: Resolve the Playwright version
        id: pw
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache the browser
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # No --with-deps: the runner image already ships Chromium's shared
      # libraries, and the apt-get it triggers took longer than the whole
      # test suite it exists to support.
      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

      - name: Serve the export
        # Backgrounded, then waited on — the tests need the server listening
        # before they start, and a fixed sleep would be a race either way.
        run: |
          npx --yes serve@latest out -l 3000 &
          npx --yes wait-on@latest http://localhost:3000/pl/ --timeout 60000

      # Pure logic, so it needs no browser and runs before the slow suites.
      - name: Chat matcher tests
        run: npm run test:chat

      # Pure logic, so no browser is needed and it runs before the slow suites.
      - name: Compatibility engine tests
        run: npm run test:compat

      - name: Calculator formula tests
        run: npm run test:calc

      - name: Theme persistence tests
        run: node tests/theme.spec.mjs
        env:
          TEST_BASE_URL: http://localhost:3000

      - name: Accessibility panel tests
        run: npm run test:a11ypanel
        env:
          TEST_BASE_URL: http://localhost:3000

      - name: Accessibility audit
        run: node tests/a11y.spec.mjs
        env:
          TEST_BASE_URL: http://localhost:3000

  # ---- Build the artefact that is actually published -----------------------
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build
        env:
          # The custom domain in CNAME, so absolute URLs in metadata and the
          # sitemap point at the real site rather than at localhost.
          NEXT_PUBLIC_SITE_URL: https://zbudujkompa.dawidolko.pl

          # Optional chat provider.
          #
          # READ THIS BEFORE SETTING THESE SECRETS. This is a static export.
          # Anything passed here is compiled into the JavaScript bundle and
          # served publicly — a GitHub Secret is secret in the Actions log, not
          # in the built site. Anyone who opens the page can read the key.
          #
          # Only ever put a free-tier key here, with a hard spending limit,
          # that you are prepared to rotate if it is abused. Never a paid key.
          #
          # Leaving these unset is a supported configuration: the assistant
          # falls back to its built-in knowledge base and works normally.
          NEXT_PUBLIC_CHAT_API_URL: ${{ secrets.CHAT_API_URL }}
          NEXT_PUBLIC_CHAT_API_KEY: ${{ secrets.CHAT_API_KEY }}
          NEXT_PUBLIC_CHAT_MODEL: ${{ secrets.CHAT_MODEL }}
          NEXT_PUBLIC_BASE_PATH: ''

      # Guards against the two failure modes that produce a live 404 while the
      # build itself reports success.
      - name: Verify the export
        run: |
          # Jekyll strips underscore-prefixed paths, which would remove _next/
          # and with it every script and stylesheet the site needs.
          test -f out/.nojekyll || {
            echo "::error::out/.nojekyll is missing - Jekyll would strip out/_next/"
            exit 1
          }

          # The custom domain is served from the artefact, not from repo settings.
          test -f out/CNAME || {
            echo "::error::out/CNAME is missing - the custom domain would be dropped"
            exit 1
          }

          # A localised entry point must exist, otherwise every route 404s.
          test -f out/pl/index.html || {
            echo "::error::out/pl/index.html is missing - the export is incomplete"
            exit 1
          }

          echo "Exported $(find out -name '*.html' | wc -l | tr -d ' ') HTML pages."

      - name: Publish to the gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
          # The export is a complete site each time; keeping old files would
          # leave routes alive after they are deleted from the source.
          force_orphan: true
          commit_message: 'deploy: ${{ github.sha }}'
