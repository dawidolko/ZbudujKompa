# =============================================================================
# nginx configuration for the exported static site.
#
# It mirrors how GitHub Pages serves the same files, so what works in this
# container works in production: directory URLs resolve to their index.html and
# an unknown path returns the 404 page with a real 404 status.
# =============================================================================

server {
    # Port 8080 rather than 80, because the server runs as an unprivileged
    # user and ports below 1024 need root.
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The export uses trailing slashes, so /platformy/ has to resolve to
    # /platformy/index.html. Without the directory fallback every section URL
    # would 404.
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Hashed build assets are immutable: the filename changes whenever the
    # content does, so they can be cached indefinitely.
    #
    # Each location repeats the security headers below. That is not redundancy
    # to be tidied away: nginx's add_header does not inherit into a block that
    # declares any add_header of its own, so omitting them here would silently
    # drop every security header on exactly these responses.
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Images are content-addressed by name here, so they get a long but not
    # permanent lifetime.
    location /images/ {
        expires 30d;
        add_header Cache-Control "public";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # HTML must revalidate: a stale page would keep serving old content and
    # point at asset hashes that no longer exist.
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Serve the real 404 document, with a 404 status. Returning 200 for a
    # missing page tells crawlers the page exists.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # ---- Security headers ----
    # Applied at server level, which covers every response that does not set
    # its own add_header. The cache-control blocks above include the same
    # snippet, because those responses would otherwise lose these headers.
    include /etc/nginx/snippets/security-headers.conf;

    # Compression. Static assets are small, but the HTML of the guide pages is
    # text-heavy enough to benefit noticeably.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Hide the version number — it tells an attacker which advisories to try.
    server_tokens off;
}
