# =============================================================================
# Security response headers.
#
# Kept in a snippet because nginx's add_header does not inherit into a location
# block that declares any add_header of its own. Every block that sets its own
# Cache-Control therefore includes this file, so the headers are defined once
# but genuinely applied everywhere.
#
# `always` makes each header apply to error responses too, not only to 2xx —
# without it the 404 page would be served with none of them.
# =============================================================================

# Stops a browser from second-guessing the declared Content-Type, which is what
# turns an uploaded or mislabelled file into an execution vector.
add_header X-Content-Type-Options "nosniff" always;

# Send the full referrer within the site, only the origin when leaving it, and
# nothing at all when downgrading to HTTP.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Framing is allowed same-origin only, so the site cannot be embedded and
# overlaid by another origin.
add_header X-Frame-Options "SAMEORIGIN" always;

# The site uses none of these devices, so they are switched off outright.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

# Content Security Policy.
#
# 'unsafe-inline' is present for scripts because two inline scripts are
# structural: the theme initialiser must run before first paint to avoid a
# flash, and Next.js inlines its own hydration bootstrap. Both are authored at
# build time, and the site accepts no user-generated content, so the injection
# surface a nonce would close does not exist here.
#
# connect-src stays 'self' by default. If the optional remote chat provider is
# configured, add that origin here as well, or the browser will block the
# request.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
